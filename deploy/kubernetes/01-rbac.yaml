apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentflow-backend
  namespace: agentflow-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runtime-manager
  namespace: agentflow-runtimes
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentflow-backend-runtime-manager
  namespace: agentflow-runtimes
subjects:
  - kind: ServiceAccount
    name: agentflow-backend
    namespace: agentflow-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runtime-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provider-credential-reader
  namespace: agentflow-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["agentflow-provider-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentflow-backend-provider-credential-reader
  namespace: agentflow-system
subjects:
  - kind: ServiceAccount
    name: agentflow-backend
    namespace: agentflow-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: provider-credential-reader
