apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentflow-artifacts
  namespace: agentflow-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - artifacts.agentflow.example.com
      secretName: agentflow-artifact-tls
  rules:
    - host: artifacts.agentflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentflow-artifacts
                port:
                  name: http
