name: Release Delivery

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-policy:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require manual releases to run from master
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
        run: |
          echo "Manual release delivery must be dispatched from master." >&2
          exit 1

      - name: Require version tags to originate from master
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

  frontend:
    name: Frontend release artifact
    needs: release-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend quality gates
        run: bash scripts/ci/frontend.sh

      - name: Upload frontend distribution
        uses: actions/upload-artifact@v7
        with:
          name: agentflow-frontend-${{ github.ref_name }}-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Backend release quality
    needs: release-policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017

    services:
      mongodb:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --ulimit nofile=64000:64000
          --health-cmd "mongosh --quiet --eval 'if (!db.runCommand({ ping: 1 }).ok) quit(1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run backend quality gates
        run: bash scripts/ci/backend.sh

  publish-studio:
    name: Publish Studio image
    needs:
      - frontend
      - backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/divi-1910/agentflow-backend
          tags: |
            type=sha,format=long
            type=ref,event=tag

      - name: Build and publish Studio image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=agentflow-backend
          cache-to: type=gha,mode=max,scope=agentflow-backend

      - name: Report immutable Studio image
        run: |
          echo "### Studio image" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.metadata.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-runtime:
    name: Publish Runtime image
    needs:
      - frontend
      - backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/divi-1910/agentflow-runtime
          tags: |
            type=sha,format=long
            type=ref,event=tag

      - name: Build and publish Runtime image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile.runtime
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=agentflow-runtime
          cache-to: type=gha,mode=max,scope=agentflow-runtime

      - name: Report immutable Runtime image
        run: |
          echo "### Runtime image" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.metadata.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
