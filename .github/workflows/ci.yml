name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend quality gates
        run: bash scripts/ci/frontend.sh

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017

    services:
      mongodb:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --ulimit nofile=64000:64000
          --health-cmd "mongosh --quiet --eval 'if (!db.runCommand({ ping: 1 }).ok) quit(1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run backend quality gates
        run: bash scripts/ci/backend.sh

  containers:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Studio
            dockerfile: backend/Dockerfile
            image: agentflow-backend
          - name: Runtime
            dockerfile: backend/Dockerfile.runtime
            image: agentflow-runtime

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: ${{ matrix.dockerfile }}
          push: false
          tags: agentflow/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
