name: agentflow

services:
  mongodb:
    image: mongo:7.0.45
    restart: unless-stopped
    volumes:
      - agentflow-mongodb:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)'"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - agentflow-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MEMORY_ROOT: /var/lib/agentflow/memory
      SCRATCHPAD_ROOT: /var/lib/agentflow/scratchpad
      MANAGED_DEPLOYMENTS_ENABLED: "false"
      PORT: "9090"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${AGENTFLOW_API_PORT:-9090}:9090"
    volumes:
      - agentflow-runtime-data:/var/lib/agentflow
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9090/health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${AGENTFLOW_WEB_PORT:-5174}:8080"
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  agentflow-mongodb:
  agentflow-redis:
  agentflow-runtime-data:
