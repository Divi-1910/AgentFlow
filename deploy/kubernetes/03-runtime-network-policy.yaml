apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: managed-runtime-boundary
  namespace: agentflow-runtimes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: agentflow
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentflow-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agentflow-backend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-system
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    # LLM providers and the HTTPS artifact endpoint are reached on 443.
    # Restrict this further with an egress gateway when the cluster provides one.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
